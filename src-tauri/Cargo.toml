[package]
name = "storyforge-desktop"
version = "3.7.5"
description = "StoryForge Windows desktop client"
authors = ["StoryForge contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "storyforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
dev-identity = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
