[package]
name = "storyforge-desktop"
version = "3.8.0"
description = "StoryForge Windows desktop client"
authors = ["StoryForge contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "storyforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
dev-identity = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
futures-util = "=0.3.32"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls", "system-proxy"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = "=0.7.18"
url = "=2.5.8"
uuid = { version = "=1.23.5", features = ["serde", "v4"] }
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
